name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate plugin and marketplace
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Validation reads local files only; it needs no Claude account.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate
        run: |
          claude plugin validate --strict .claude-plugin/plugin.json
          claude plugin validate --strict .

  gotest:
    name: Go tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # The tests need no Ollama, network or API keys: they use a local fake LLM server
      # and the test binary itself as a fake `claude` executable.
      - name: Vet
        run: go vet ./...

      - name: Check formatting
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l .)"

      - name: Run tests
        run: go test ./...

  binaries:
    name: Build binaries and run the launcher on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Check JSON files
        run: |
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json hooks/hooks.json .mcp.json bench/*.json; do
            node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$f" || { echo "::error file=$f::invalid JSON"; exit 1; }
          done

      - name: Committed binaries exist for every platform
        run: |
          for p in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do test -x "dist/$p/local-shunt"; done
          for p in windows-amd64 windows-arm64; do test -f "dist/$p/local-shunt.exe"; done

      - name: Build all platforms
        run: scripts/build.sh

      - name: Run the hook and the commands through the launchers
        env:
          LOCAL_SHUNT_MODEL: none
          OLLAMA_HOST: http://127.0.0.1:9
        run: |
          bin/local-shunt version
          bin/bulk-read --help | grep -q -- --paths
          bin/code-write --help | grep -q -- --reference
          # The worker is unreachable, so the hook must allow the read and print nothing.
          out=$(printf '{"tool_name":"Read","tool_input":{"file_path":"README.md"},"cwd":"%s"}' "$PWD" | bin/local-shunt hook pre-tool-use)
          test -z "$out"
          printf '{"jsonrpc":"2.0","id":1,"method":"ping"}\n' | bin/local-shunt mcp | grep -q '"result":{}'
